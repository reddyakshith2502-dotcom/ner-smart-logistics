<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="solarBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgSolar)"/>
  <path d="M 50 380 Q 400 370 750 380 L 750 450 L 50 450 Z" fill="#09101d"/>
  
  <!-- Truck Cab -->
  <path d="M 120 220 L 220 220 L 280 175 L 390 175 L 410 240 L 410 330 L 120 330 Z" fill="url(#solarBody)" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="220,220 275,180 380,180 395,220" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
  
  <!-- Open Flatbed Flatbed Carrying Solar Panels -->
  <rect x="420" y="190" width="310" height="140" fill="#134e4a" stroke="#2dd4bf" stroke-width="3" rx="4"/>
  <rect x="440" y="160" width="270" height="40" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="575" y="185" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">⚡ SOLAR POWER PANELS INFRASTRUCTURE</text>

  <text x="575" y="250" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ccfbf1" text-anchor="middle">TRIPURA INFRASTRUCTURE</text>
  <text x="575" y="280" font-family="sans-serif" font-weight="bold" font-size="13" fill="#2dd4bf" text-anchor="middle">SILCHAR HUB → AGARTALA PARK</text>

  <!-- Teal Stripe -->
  <rect x="120" y="275" width="610" height="12" fill="#2dd4bf"/>
  
  <!-- Wheels -->
  <circle cx="210" cy="335" r="45" fill="#0f172a" stroke="#2dd4bf" stroke-width="4"/>
  <circle cx="210" cy="335" r="24" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
  
  <circle cx="530" cy="335" r="45" fill="#0f172a" stroke="#2dd4bf" stroke-width="4"/>
  <circle cx="530" cy="335" r="24" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>

  <circle cx="640" cy="335" r="45" fill="#0f172a" stroke="#2dd4bf" stroke-width="4"/>
  <circle cx="640" cy="335" r="24" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
</svg>
