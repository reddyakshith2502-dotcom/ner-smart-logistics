<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="silverTank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgTank)"/>
  <path d="M 50 380 Q 400 370 750 380 L 750 450 L 50 450 Z" fill="#030712"/>
  
  <!-- Truck Cab -->
  <path d="M 120 220 L 220 220 L 280 180 L 380 180 L 400 240 L 400 330 L 120 330 Z" fill="#dc2626" stroke="#ef4444" stroke-width="2"/>
  <polygon points="220,220 275,185 370,185 385,220" fill="#111827" stroke="#dc2626" stroke-width="1.5"/>
  
  <!-- Fuel Tank Cylinder -->
  <rect x="390" y="170" width="310" height="150" rx="40" fill="url(#silverTank)" stroke="#6b7280" stroke-width="3"/>
  <rect x="420" y="220" width="250" height="50" rx="8" fill="#7f1d1d"/>
  <text x="545" y="253" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">PETROLEUM TANKER</text>
  <text x="545" y="295" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ef4444" text-anchor="middle">⚠️ FLAMMABLE HIGH-ALT FUEL</text>
  
  <!-- Wheels -->
  <circle cx="200" cy="335" r="45" fill="#111827" stroke="#4b5563" stroke-width="5"/>
  <circle cx="200" cy="335" r="24" fill="#374151" stroke="#dc2626" stroke-width="2"/>
  
  <circle cx="470" cy="335" r="45" fill="#111827" stroke="#4b5563" stroke-width="5"/>
  <circle cx="470" cy="335" r="24" fill="#374151" stroke="#dc2626" stroke-width="2"/>

  <circle cx="580" cy="335" r="45" fill="#111827" stroke="#4b5563" stroke-width="5"/>
  <circle cx="580" cy="335" r="24" fill="#374151" stroke="#dc2626" stroke-width="2"/>

  <circle cx="670" cy="335" r="45" fill="#111827" stroke="#4b5563" stroke-width="5"/>
  <circle cx="670" cy="335" r="24" fill="#374151" stroke="#dc2626" stroke-width="2"/>
</svg>
