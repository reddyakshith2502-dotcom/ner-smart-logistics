<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgTel)"/>
  
  <ellipse cx="400" cy="380" rx="320" ry="25" fill="rgba(0,0,0,0.6)"/>
  <path d="M 50 380 Q 400 370 750 380 L 750 450 L 50 450 Z" fill="#070d19"/>
  
  <!-- Antenna Dish on roof -->
  <ellipse cx="440" cy="140" rx="35" ry="15" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <line x1="440" y1="140" x2="440" y2="180" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Car Body -->
  <path d="M 140 240 L 250 240 L 320 180 L 580 180 L 640 240 L 660 330 L 140 330 Z" fill="url(#carBody)" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="250,240 315,185 570,185 590,240" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
  
  <!-- Amber Telematics Stripe -->
  <rect x="140" y="275" width="520" height="12" fill="#f59e0b"/>
  
  <text x="440" y="240" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">TELEMATICS PATROL</text>
  <text x="440" y="265" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fef08a" text-anchor="middle">ACTIVE SYNC MOBILE UNIT</text>
  
  <!-- Headlights -->
  <polygon points="140,250 140,280 155,280 155,250" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Wheels -->
  <circle cx="230" cy="335" r="45" fill="#0f172a" stroke="#475569" stroke-width="5"/>
  <circle cx="230" cy="335" r="24" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  
  <circle cx="560" cy="335" r="45" fill="#0f172a" stroke="#475569" stroke-width="5"/>
  <circle cx="560" cy="335" r="24" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
</svg>
